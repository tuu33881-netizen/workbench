<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>填入 2号台 · 2026-10-23</title>
<style>
body{font-family:-apple-system,"PingFang SC",sans-serif;margin:24px;max-width:720px;line-height:1.5}
#log{white-space:pre-wrap;background:#f6f8fa;border:1px solid #ddd;border-radius:8px;padding:12px;min-height:120px;font-size:13px}
.ok{color:#0a8a3a}.err{color:#c62828}
button{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:#16b55a;color:#fff;font-weight:700;cursor:pointer}
iframe{position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
a{color:#1565c0}
</style>
</head>
<body>
<h1>填入 2号台</h1>
<p>把今晚 32 条注单写入本机浏览器的 <b>2号台</b>（与 1号台数据隔离）。请用 <b>Chrome/Safari</b> 打开本页（须与工作台同域）。</p>
<p><button id="go" type="button">开始填入</button>
<a href="./index.html?t=2" target="_blank">打开 2号台</a></p>
<div id="log">准备就绪。点「开始填入」。</div>
<script>
const DT = "2026-10-23";
const SLIPS = [
"兔蛇羊各数10斤\n狗鼠各数20斤",
"27-33-39-31-43-各10\n21-27-33-35-36-39-30-19-34-42-29-41-22-25-37-44-各5\n19-44-各20",
"老澳27各320斤。07/31/01/37/32/44各5斤。",
"鼠各数25\n07-19各数30\n\n07-19-18-30-23-35各数10",
"07.43.03.27.23.04.40.02.26特各数6。31.35.22.34特各数8。",
"鼠蛇马狗各数20，猪牛龙各数10。",
"鼠猪各数10",
"27-39-43-31-26-47-34各10\n15.21.23.10.25.11.18.30.42.02.38.10.22各5",
"马猪鼠龙各数20斤，老\n\n蛇鼠虎各数8斤，香",
"01 13 09 45各数15",
"龙鸡猴狗各数20。",
"马各5\n01-49各10",
"01+05+07+11+13+16+17+19+23+29+32+35+43+49各20\n12+25+31+36+37+41+47各10\n32+49各20\n01+07+19+29+35各6  新",
"龙各5",
"06-27各25",
"10.12.24.21.19.16.28.13各7斤老\n34.36.48.45.31.43.40.37各5斤老\n\n35.46.45.43.02.34.41各8斤香\n\n34.46.12.18.30.45.29各8\n10.36.15.27.39.06.33.11.47.17.41各6新",
"33.39各10\n09#15",
"老奥\n马狗猴各数50\n19.43.#50\n27.03.#25\n09.45..47.23..01.25.49各数100",
"平特蛇800",
"38.39.33.45.32.44.30.42.34.46.各5斤，02.14.26.27.21.08.20.36.48.06.18.10.22.各10斤，12.24.各50斤，奥",
"03,07,08,09,10,13,14,15,18,19,各55",
"20,21,22,23,26,32,33,34,35,37,45,49,各55",
"蛇猪羊各数 5",
"牛，马，羊，狗，鸡，猪各数10斤，红波每个数10斤",
"猴鼠羊各数80斤\n23.07.24.36.19各20斤",
"龙狗各数20",
"牛各数20",
"03 04 09 10 14 15 20 25 26 31 36 37 41 42 47 48 各5",
"39 27 07 43 21 33 #50\n15.25.49.45.#20",
"20.32 各 5",
"鼠牛格数20",
"30.42.22.29.24.48.44各5\n\n31.43.41.47.35.32.20各20"
];

const logEl = document.getElementById("log");
function log(s, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = s;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function waitReady(w, tries=80) {
  for (let i=0;i<tries;i++) {
    if (w.__WB && w.__WB.D && w.document.getElementById("wb_save")) return true;
    await sleep(100);
  }
  return false;
}

async function run() {
  const btn = document.getElementById("go");
  btn.disabled = true;
  logEl.textContent = "";
  log("切换到 2号台并加载工作台…");
  try { sessionStorage.setItem("wb_tai", "2"); } catch (e) {}

  const old = document.querySelector("iframe");
  if (old) old.remove();
  const iframe = document.createElement("iframe");
  iframe.src = "./index.html?t=2&_=" + Date.now();
  document.body.appendChild(iframe);

  await new Promise((resolve, reject) => {
    iframe.onload = () => resolve();
    iframe.onerror = () => reject(new Error("iframe 加载失败"));
    setTimeout(() => resolve(), 8000);
  });

  const w = iframe.contentWindow;
  const doc = iframe.contentDocument;
  if (!w || !doc) { log("无法访问工作台帧（请确认同域打开）", "err"); btn.disabled=false; return; }

  w.confirm = () => true;
  w.alert = (m) => log("提示: " + m);

  const ok = await waitReady(w);
  if (!ok) { log("工作台未就绪（可能还在选台/启动）", "err"); btn.disabled=false; return; }

  // ensure desk 2 storage key
  const tai = (function(){ try { return sessionStorage.getItem("wb_tai") || "?"; } catch(e){ return "?"; }})();
  log("当前台: " + tai + (tai==="2" ? " ✓" : "（期望 2）"), tai==="2"?"ok":"err");

  const dateEl = doc.getElementById("wb_date");
  if (dateEl) dateEl.value = DT;

  // clear today's bets on desk 2 first? Only if empty-ish — ask via confirm already forced true
  // Safer: append. User asked to fill; if duplicates, save may warn — we auto-confirm.

  let saved = 0, failed = [];
  for (let i=0; i<SLIPS.length; i++) {
    const slip = SLIPS[i];
    const box = doc.getElementById("wb_paste_box");
    if (box) box.open = true;
    const ta = doc.getElementById("wb_text");
    const to = doc.getElementById("wb_to");
    const saveBtn = doc.getElementById("wb_save");
    ta.value = slip;
    if (to) { to.value = "new"; delete to.dataset.user; }
    try { w.__WB.parseWB(); } catch (e) { failed.push({i:i+1, err:String(e), preview: slip.slice(0,40)}); continue; }
    const pv = w.__WB.wbPV || [];
    if (!pv.length) {
      failed.push({i:i+1, err:"识别为空", preview: slip.slice(0,60)});
      log("#" + (i+1) + " 识别为空", "err");
      continue;
    }
    const before = (w.__WB.D.bets || []).filter(b => b.date === DT).length;
    saveBtn.click();
    await sleep(80);
    const after = (w.__WB.D.bets || []).filter(b => b.date === DT).length;
    if (after <= before) {
      // try reading msg
      const msg = (doc.getElementById("wb_msg") || {}).textContent || "";
      failed.push({i:i+1, err:"保存未增加注单 " + msg, preview: slip.slice(0,40)});
      log("#" + (i+1) + " 保存失败: " + msg, "err");
    } else {
      saved++;
      const amt = pv.reduce((a,b)=>a+(+b.amount||0),0);
      log("#" + (i+1) + " 已存 " + pv.length + " 注 / 约 " + amt, "ok");
    }
  }

  const day = (w.__WB.D.bets || []).filter(b => b.date === DT);
  const tot = day.reduce((a,b)=>a+(+b.amount||0),0);
  const grps = new Set(day.map(b => b.grp || 1)).size;
  log("——");
  log("完成：成功保存轮次 " + saved + " / " + SLIPS.length, saved===SLIPS.length?"ok":"err");
  log("2号台 " + DT + "：订单约 " + grps + "，注 " + day.length + "，总额 " + Math.round(tot*100)/100 + "（期望约 9816）", Math.abs(tot-9816)<1?"ok":"");
  if (failed.length) {
    log("失败明细:", "err");
    failed.forEach(f => log("  #" + f.i + " " + f.err + " | " + f.preview, "err"));
  }
  log("请打开 2号台核对: index.html?t=2");
  btn.disabled = false;
}

document.getElementById("go").onclick = () => run().catch(e => { log(String(e&&e.message||e), "err"); document.getElementById("go").disabled=false; });
// auto-run once
setTimeout(() => { document.getElementById("go").click(); }, 400);
</script>
</body>
</html>
